<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Catch — Code Your Line</title>
<meta name="description" content="A code-your-rod fishing game. Learn to program by catching fish, from a quiet pond to giant ocean fish.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top-bar">
    <div class="brand">
      <span class="brand-icon">🎣</span>
      <span class="brand-name">Perfect Catch</span>
    </div>
    <nav id="top-nav">
      <button class="nav-btn" data-scene="menu">Menu</button>
      <button class="nav-btn" data-scene="character">Angler</button>
      <button class="nav-btn" data-scene="tacklebox">Tackle Box</button>
      <button class="nav-btn" data-scene="levels">Adventures</button>
    </nav>
    <div class="money-display">
      <span class="coin">$</span>
      <span id="money-amount">0</span>
    </div>
  </header>

  <main id="game-area">
    <div id="canvas-holder"></div>
    <aside id="side-panel"></aside>
  </main>

  <div id="toast-root"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
