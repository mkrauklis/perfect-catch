<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Catch — Code Your Line</title>
<meta name="description" content="A code-your-rod fishing game. Learn to program by catching fish, from a quiet pond to giant ocean fish.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top-bar">
    <div class="brand">
      <span class="brand-icon">🎣</span>
      <span class="brand-name">Perfect Catch</span>
    </div>
    <nav id="top-nav">
      <button class="nav-btn" data-scene="menu">Menu</button>
      <button class="nav-btn" data-scene="character">Angler</button>
      <button class="nav-btn" data-scene="tacklebox">Tackle Box</button>
      <button class="nav-btn" data-scene="levels">Adventures</button>
    </nav>
    <div class="money-display">
      <span class="coin">$</span>
      <span id="money-amount">0</span>
    </div>
  </header>

  <main id="game-area">
    <div id="canvas-holder"></div>
    <aside id="side-panel"></aside>
  </main>

  <div id="toast-root"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<!-- Plain classic scripts, not ES modules, on purpose: this lets the game
     run by double-clicking index.html (file://) with no local server, the
     same as this repo's other p5 projects. Order matters — each file below
     depends only on files loaded before it. -->
<script src="js/data/cosmetics.js"></script>
<script src="js/data/gear.js"></script>
<script src="js/data/fish.js"></script>
<script src="js/data/levels.js"></script>
<script src="js/engine/GameState.js"></script>
<script src="js/engine/Simulation.js"></script>
<script src="js/engine/CodeRunner.js"></script>
<script src="js/engine/Game.js"></script>
<script src="js/entities/Angler.js"></script>
<script src="js/entities/FishSprite.js"></script>
<script src="js/ui/backgrounds.js"></script>
<script src="js/scenes/MenuScene.js"></script>
<script src="js/scenes/CharacterCreatorScene.js"></script>
<script src="js/scenes/TackleBoxScene.js"></script>
<script src="js/scenes/LevelSelectScene.js"></script>
<script src="js/scenes/FishingScene.js"></script>
<script src="js/main.js"></script>
</body>
</html>
